# =============================================================================
# Configuración de los experimentos
# =============================================================================
# Edite un valor, guarde el archivo y vuelva a ejecutar:
#     python -m scripts.parte1_pd.entrenar_pd      (Parte 1: probabilidad de incumplimiento)
#     python -m scripts.parte2_lgd.entrenar_lgd     (Parte 2: pérdida dado incumplimiento)
#
# También se puede cambiar un valor solo para una ejecución, sin editar este archivo:
#     python -m scripts.parte1_pd.entrenar_pd --set red.capas_ocultas=64,32 --set entrenamiento.tasa=0.01
#
# Formato:
#   - listas separadas por comas (o una por línea, con sangría)
#   - una lista vacía se deja en blanco:  capas_ocultas =
#   - sí / no para valores lógicos
#   - lo que va después de # es un comentario


[general]
semilla = 42                    # fija inicialización, orden de los lotes y dropout


# =============================================================================
# PARTE 1: probabilidad de incumplimiento (PD)
# =============================================================================

[pd.datos]
# Generado por:  python -m scripts.parte1_pd.preparar_datos_pd   (solo créditos a 36 meses, partición temporal)
ruta = data/processed/pd_limpio.parquet
objetivo = y                    # 1 = malo, 0 = bueno
particion = particion           # columna con los valores train / valid / test
fraccion_demo = 0.2             # fracción de los datos que se usa con --demo
numericas =
    loan_amnt, emp_length, annual_inc, dti, delinq_2yrs, inq_last_6mths,
    mths_since_last_delinq, open_acc, pub_rec, revol_bal, revol_util, total_acc,
    antig_credito_meses
con_tope =                      # tope superior en el percentil 99 de train
    delinq_2yrs, inq_last_6mths, open_acc, total_acc, antig_credito_meses,
    annual_inc, revol_bal
logaritmicas = annual_inc, revol_bal      # log(1 + x), después del tope
indicadoras = nunca_mora, emp_length_na   # 0/1, no se escalan
categoricas = home_ownership, purpose
frecuencia_minima = 0.01        # categorías menos frecuentes en train se agrupan en "otras"

# Configuración final: la de mayor AUC en validación de scripts/parte1_pd/buscar_hiperparametros_pd.py
# (40 configuraciones de MLP; ver reports/busqueda_pd.csv). La mejor regresión logística
# de esa búsqueda se entrena con:  --set red.capas_ocultas= --set red.dropout=0 --set red.l2=0.001
[pd.red]
capas_ocultas = 64, 32          # neuronas por capa oculta; en blanco = regresión logística
activacion = relu               # relu | tanh | sigmoide
l2 = 0.0014                     # penalización L2 (lambda); 0 = sin penalización
dropout = 0.3                   # probabilidad de apagar cada neurona oculta; 0 = sin dropout

[pd.entrenamiento]
optimizador = adam              # adam | sgd
tasa = 0.0026                   # tasa de aprendizaje
epocas = 200                    # máximo de épocas
tam_lote = 512                  # tamaño del mini-lote
paciencia = 10                  # parada temprana: épocas sin mejorar en validación

[pd.scorecard]
puntaje_base = 600              # puntaje asignado a las odds de referencia
odds_base = 50                  # odds buenos:malos de referencia (50 = 50 buenos por cada malo)
pdo = 20                        # puntos para duplicar las odds

[pd.salida]
carpeta = models/pd             # aquí se guarda el modelo que usa la aplicación web


# =============================================================================
# PARTE 2: pérdida dado incumplimiento (LGD)
# =============================================================================

[lgd.datos]
ruta = data/processed/lgd_limpio.parquet
objetivo = lgd
particion = particion
fraccion_demo = 0.2
recortar_objetivo = 0, 1        # recorta la LGD a [0, 1]; en blanco = no recortar
# TODO: ajustar a las variables del equipo de la Parte 2. Solo variables conocidas al
# otorgar el crédito (nada de recoveries, total_pymnt, collection_recovery_fee...).
numericas =
    loan_amnt, term, emp_length, annual_inc, dti, delinq_2yrs,
    antiguedad_credito_meses, inq_last_6mths, mths_since_last_delinq,
    mths_since_last_record, open_acc, pub_rec, revol_bal, revol_util, total_acc
logaritmicas = annual_inc, revol_bal
categoricas = home_ownership, purpose

[lgd.red]
capas_ocultas = 32, 16          # en blanco + salida identidad + ecm = regresión lineal
activacion = relu               # relu | tanh | sigmoide
salida = sigmoide               # sigmoide (predicción en (0, 1)) | identidad
perdida = ecm                   # ecm | entropia_cruzada (respuesta fraccional, requiere sigmoide)
l2 = 0.0001
dropout = 0.1

[lgd.entrenamiento]
optimizador = adam
tasa = 0.001
epocas = 200
tam_lote = 256
paciencia = 10

[lgd.salida]
carpeta = models/lgd


# =============================================================================
# APLICACIÓN WEB:  streamlit run app/app.py
# =============================================================================

[app]
modelo = models/pd_logistica        # modelo principal del simulador
modelo_comparacion = models/pd      # se puede elegir en el menú lateral
enlace_reporte = https://mgtdevnet.github.io/T02_REDES_NEURONALES_/    # URL de la entrada de blog (en blanco = "disponible pronto")
enlace_video = https://www.youtube.com/watch?v=cy8w_VjKIy0    # URL del video promocional
enlace_repositorio = https://github.com/MgtDevNet/T02_REDES_NEURONALES_
