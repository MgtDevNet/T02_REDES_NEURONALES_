# Tema de la aplicación web (morado, superficies claras; tipografía Inter en app/estilo.py)
[theme]
base = "light"
primaryColor = "#7b2cbf"
backgroundColor = "#f7f4fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#2d0a4e"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
